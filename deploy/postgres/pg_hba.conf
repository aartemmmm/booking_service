# Правила аутентификации PostgreSQL для Primary и Replica.
#
# Файл подключается параметром "-c hba_file=/etc/postgresql/pg_hba.conf"
# в docker-compose.yml, поэтому действует одинаково и на существующем томе
# с данными, и на новом. Первые строки повторяют значения по умолчанию
# официального образа postgres.

# TYPE  DATABASE        USER            ADDRESS         METHOD
local   all             all                             trust
host    all             all             127.0.0.1/32    trust
host    all             all             ::1/128         trust
local   replication     all                             trust
host    replication     all             127.0.0.1/32    trust
host    replication     all             ::1/128         trust

# Обычные подключения: приложение, psql, слушатель уведомлений
host    all             all             all             scram-sha-256

# Подключение Replica к Primary за потоком WAL.
# "replication" — отдельная псевдо-база: строка "host all all all" выше такие
# подключения не разрешает. Подключиться может только роль с атрибутом REPLICATION.
host    replication     all             all             scram-sha-256
